name = "business-ideas"
main = "src/index.ts"
compatibility_date = "2026-06-16"

[vars]
DEFAULT_AI_PROVIDER = "openai"
DEFAULT_AI_MODEL = "gpt-5-mini"

[[d1_databases]]
binding = "BUSINESS_IDEAS_DB"
database_name = "business-ideas"
database_id = "replace-with-cloudflare-d1-database-id"

[[r2_buckets]]
binding = "BUSINESS_IDEAS_BUCKET"
bucket_name = "business-ideas"

# AI Search V1 can be configured through REST env vars until a stable Worker binding is used:
# CLOUDFLARE_ACCOUNT_ID
# CLOUDFLARE_API_TOKEN
# CLOUDFLARE_AI_SEARCH_INSTANCE_ID
