name = "business-ideas"
main = "src/index.ts"
compatibility_date = "2026-06-16"

[vars]
DEFAULT_AI_PROVIDER = "openai"
DEFAULT_AI_MODEL = "gpt-5-mini"
# Comma-separated browser origins that may call the Worker directly.
# Example: "http://localhost:5173,https://example.com"
ALLOWED_ORIGINS = "http://localhost:5173"

[[d1_databases]]
binding = "BUSINESS_IDEAS_DB"
database_name = "business-ideas"
database_id = "<YOUR_D1_DATABASE_ID>"

[[r2_buckets]]
binding = "BUSINESS_IDEAS_BUCKET"
bucket_name = "business-ideas"

[[ai_search]]
binding = "BUSINESS_IDEAS_SEARCH"
instance_name = "business-ideas-search"
